[project]
name = "susucal"
version = "0.1.0"
description = "Синк расписания ЮУрГУ-Онлайн и Moodle с календарём iCloud (CalDAV)"
authors = [
    {name = "PGuin",email = "138515193+pguin-sudo@users.noreply.github.com"}
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "icalendar>=6.0",
    "caldav>=1.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "basedpyright>=1.13"]

[project.scripts]
susucal = "susucal.cli:main"

[tool.poetry]
packages = [{ include = "susucal", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "SIM", "TCH", "PGH", "RET", "PLC", "PLE", "PLW", "RUF",
]
ignore = [
    "RUF001", "RUF002", "RUF003", "PLW0642", "E501", "B008", "SIM117", "TC001", "TC002", "TC003",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.basedpyright]
typeCheckingMode = "recommended"
useLibraryCodeForTypes = true
include = ["src"]
exclude = [
    "**/__pycache__",
    "**/migrations",
    "**/.venv",
]
reportMissingTypeStubs = false
